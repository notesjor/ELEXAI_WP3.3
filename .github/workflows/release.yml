
name: Publish all projects

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

env:
  PROJECTS_DIR: Tools

jobs:

  # ------------------------------------------
  # 1. Alle C#-Projekte automatisch finden
  # ------------------------------------------
  discover:
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.set-matrix.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Discover projects and create build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "$PROJECTS_DIR" ]]; then
            echo "Project directory not found: $PROJECTS_DIR"
            exit 1
          fi

          matrix='[]'
          prefix="${PROJECTS_DIR%/}/"

          while IFS= read -r -d '' csproj; do

            relative="${csproj#"$prefix"}"

            project_id="$(printf '%s' "${relative%.csproj}" \
              | sed -E 's/[^A-Za-z0-9._-]+/-/g')"

            echo "Found project: $relative"

            # All three x64 profiles
            for target in \
              "win-x64 windows-2025" \
              "osx-x64 macos-15-intel" \
              "linux-x64 ubuntu-24.04"; do

              read -r rid runner <<< "$target"

              matrix="$(jq -c \
                --arg project "$csproj" \
                --arg project_id "$project_id" \
                --arg rid "$rid" \
                --arg runner "$runner" \
                '. + [{
                  project: $project,
                  project_id: $project_id,
                  rid: $rid,
                  runner: $runner
                }]' <<< "$matrix")"

            done

          done < <(
            find "$PROJECTS_DIR" \
              -type f \
              -name '*.csproj' \
              -not -path '*/bin/*' \
              -not -path '*/obj/*' \
              -print0 | sort -z
          )

          if [[ "$matrix" == "[]" ]]; then
            echo "No C# projects found!"
            exit 1
          fi

          echo "value=$matrix" >> "$GITHUB_OUTPUT"


  # ------------------------------------------
  # 2. Alle Projekte für drei Plattformen bauen
  # ------------------------------------------
  publish:
    needs: discover

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish project
        run: dotnet publish "${{ matrix.project }}" --configuration Release --runtime "${{ matrix.rid }}" --self-contained true --output ./publish

      - name: Create ZIP package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path release-assets -Force | Out-Null

          $archiveName = "${{ matrix.project_id }}-${{ matrix.rid }}.zip"
          $archivePath = "release-assets/$archiveName"

          if ($IsWindows) {

            Compress-Archive `
              -Path "publish/*" `
              -DestinationPath $archivePath `
              -Force

          }
          else {

            Push-Location publish

            zip -qr "../$archivePath" .

            if ($LASTEXITCODE -ne 0) {
              throw "ZIP creation failed!"
            }

            Pop-Location
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.project_id }}-${{ matrix.rid }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 1


  # ------------------------------------------
  # 3. Ein GitHub Release mit allen Paketen
  # ------------------------------------------
  release:
    needs: publish

    runs-on: ubuntu-24.04

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"

          shopt -s nullglob
          assets=(release-assets/*.zip)

          if (( ${#assets[@]} == 0 )); then
            echo "No release packages found!"
            exit 1
          fi

          echo "Creating release for $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release already exists. Uploading new assets..."

            gh release upload "$TAG" "${assets[@]}" --clobber

          else

            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --generate-notes

          fi
